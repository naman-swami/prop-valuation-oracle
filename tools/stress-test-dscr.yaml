annotations:
  cost: none
  read_only: true
  requires_confirmation: false
description: Evaluate Debt Service Coverage Ratio under varying interest rates and
  debt structures.
input_schema:
  additionalProperties: false
  properties:
    annual_debt_service:
      type: number
    net_operating_income:
      type: number
    stress_rate_increase_bps:
      type: number
  required:
  - net_operating_income
  - annual_debt_service
  type: object
name: stress-test-dscr
output_schema:
  additionalProperties: false
  properties:
    confidence:
      type: number
    data:
      type: string
    status:
      type: string
  required:
  - status
  - data
  type: object
